name: Build and deploy hub

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild: refreshes the reading feed + re-indexes the spoke sites
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Refresh reading aggregator
        run: python3 scripts/fetch_reading.py
        continue-on-error: true
      - name: Refresh Counterfactuals data catalogue
        run: node scripts/sync-counterfactuals.mjs
      - name: Run factual and voice release gate
        run: npm run check:copy
      - name: Verify fieldbook routes, navigation contract, and evidence components
        run: |
          npm run check:fieldbook
          npm run check:navigation
          npm run check:tokens
          npm run check:components
          npm run check:macroeconomics
          npm run check:calculus
          npm run check:ols
          npm run check:econ-practice
      - name: Verify economics Worker startup and D1 response workflow
        timeout-minutes: 3
        run: |
          npx wrangler d1 migrations apply helfrich-economics-responses --local --persist-to .local/econ-response/ci-runtime --config services/econ-response/wrangler.jsonc
          npx wrangler dev --local --port 8788 --persist-to .local/econ-response/ci-runtime --config services/econ-response/wrangler.jsonc > /tmp/economics-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8788/health > /dev/null; then break; fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then cat /tmp/economics-worker.log; exit 1; fi
            sleep 1
          done
          node scripts/econ-practice/verify-local-worker.mjs
      - name: Verify ocean calculations, coastal retrieval, and scientific release files
        run: |
          node --test tests/unit/hidden-rivers*.test.mjs tests/unit/water-atlas.test.mjs tests/unit/dye-tank*.test.mjs
          python3 scripts/hidden-rivers/validate-release.py
          python3 -m unittest discover -s tests/unit -p 'hidden_rivers_release_test.py'
      - name: Check policy statistics calculations
        run: node --test tests/unit/policy-statistics.test.mjs tests/unit/spatial-investment.test.mjs
      - name: Check market mechanics calculations and rendering
        run: node --test tests/unit/market-mechanics*.test.cjs
      - name: Verify city walking comparisons
        run: npm run check:city
      - name: Build hub
        run: npm run build:fast
        env:
          PUBLIC_ECON_API_URL: ${{ vars.PUBLIC_ECON_API_URL }}
          PUBLIC_CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
      - name: Verify homepage interactions and portrait
        run: node --test tests/unit/homepage-data.test.mjs tests/unit/homepage-ui.test.mjs tests/unit/homepage-continuum.test.mjs
      - name: Verify econometrics edition
        run: npm run check:econometrics
      - name: Verify rendered headline styles
        run: npm run check:styles
      - name: Verify public career and research artifacts
        run: npm run check:public-cv
      - name: Mirror spokes for indexing
        run: |
          mkdir -p dist/american-policy-atlas
          wget -r -np -nH --cut-dirs=1 -R "index.html?*" -P dist/american-policy-atlas https://ihelfrich.github.io/american-policy-atlas/ || true
      - name: Build Pagefind index
        run: npx pagefind --site dist --output-path dist/pagefind
      - name: Remove spoke copy (Pages routes the subpath to its project repo)
        run: rm -rf dist/american-policy-atlas
      - name: Verify public discovery surfaces
        run: npm run check:discovery
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Commit refreshed public data caches
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/feeds/*.json public/data/counterfactuals
          git diff --staged --quiet || git commit -m "chore: refresh public data caches"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
