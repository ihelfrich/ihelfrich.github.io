name: Build and deploy hub

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild: refreshes the reading feed + re-indexes the spoke sites
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Refresh reading aggregator
        run: python3 scripts/fetch_reading.py
        continue-on-error: true
      - name: Refresh Counterfactuals data catalogue
        run: node scripts/sync-counterfactuals.mjs
        continue-on-error: true
      - name: Run factual and voice release gate
        run: npm run check:copy
      - name: Verify fieldbook routes and evidence components
        run: |
          npm run check:fieldbook
          npm run check:components
      - name: Build hub
        run: npm run build:fast
      - name: Verify rendered headline styles
        run: npm run check:styles
      - name: Verify public career and research artifacts
        run: npm run check:public-cv
      - name: Mirror spokes for indexing
        run: |
          mkdir -p dist/american-policy-atlas
          wget -r -np -nH --cut-dirs=1 -R "index.html?*" -P dist/american-policy-atlas https://ihelfrich.github.io/american-policy-atlas/ || true
      - name: Build Pagefind index
        run: npx pagefind --site dist --output-path dist/pagefind
      - name: Remove spoke copy (Pages routes the subpath to its project repo)
        run: rm -rf dist/american-policy-atlas
      - name: Verify public discovery surfaces
        run: npm run check:discovery
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Commit refreshed public data caches
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/feeds/*.json public/data/counterfactuals
          git diff --staged --quiet || git commit -m "chore: refresh public data caches"
          git push || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
