name: Build and deploy hub

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild: refreshes the reading feed + re-indexes the spoke sites
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Refresh reading aggregator
        run: python3 scripts/fetch_reading.py
        continue-on-error: true
      - name: Build hub
        run: npm run build:fast
      - name: Mirror spokes for indexing
        run: |
          mkdir -p dist/inference-lab dist/macroprep
          wget -r -np -nH --cut-dirs=1 -R "index.html?*" -P dist/inference-lab https://ihelfrich.github.io/inference-lab/ || true
          wget -r -np -nH --cut-dirs=1 -R "index.html?*" -P dist/macroprep https://ihelfrich.github.io/macroprep/ || true
      - name: Build Pagefind index
        run: npx pagefind --site dist --output-path dist/pagefind
      - name: Remove spoke copies (Pages routes /inference-lab to its own repo)
        run: rm -rf dist/inference-lab dist/macroprep
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Commit refreshed feed cache
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/feeds/*.json
          git diff --staged --quiet || git commit -m "chore: refresh reading feed cache"
          git push || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
