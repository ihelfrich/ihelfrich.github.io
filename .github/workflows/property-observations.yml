name: Refresh property source observations

on:
  workflow_dispatch:
  schedule:
    - cron: "43 10 * * *"

permissions:
  contents: write
  actions: write

# Share the Pages/cache-writer lock; deployment is queued without waiting here.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATA_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Verify observation invariants before collection
        run: timeout 90 node --test tests/unit/city-property-history.test.mjs
      - name: Verify utility acquisition on the runner's Python version
        run: timeout 90 uv run --no-project python scripts/st-louis/test_property_utilities.py
      - name: Collect bounded authoritative sources
        id: collect
        # A failed source records public health while retaining its last good data.
        continue-on-error: true
        run: timeout 1900 uv run --no-project python scripts/st-louis/refresh_property_observations.py --all-sources
      - name: Validate the completed ledger
        run: timeout 90 node --test tests/unit/city-property-history.test.mjs
      - name: Commit only approved data and source health
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for directory in history ownership-signals planning-documents incentives utilities; do
            if [ -d "public/st-louis/$directory" ]; then
              git add -- "public/st-louis/$directory"
            fi
          done
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: record dated property source observations"
          timeout 60 git push origin "HEAD:$DATA_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Queue existing Pages deployment
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 30 gh workflow run deploy.yml --ref "$DATA_BRANCH" --repo "$GITHUB_REPOSITORY"
          echo "Public observations and source health were committed. Pages deployment was queued; completion is reported by that workflow." >> "$GITHUB_STEP_SUMMARY"
      - name: Report retained-data collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::At least one source was unavailable or invalid. Its previous complete evidence was retained; inspect the published source-health receipt."
          echo "Source retrieval failure is not an empty result or an ownership change. No acquisition is inferred by this collector." >> "$GITHUB_STEP_SUMMARY"
          exit 1
