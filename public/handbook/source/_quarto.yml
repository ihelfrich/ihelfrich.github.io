project:
  type: book
  output-dir: _book
book:
  title: Econometrics Across Disciplines
  subtitle: Measurement, models, and decisions
  author: Ian Helfrich, PhD
  date: October 2026
  date-format: MMMM YYYY
  chapters:
    - index.qmd
    - 01-questions.qmd
    - 02-measurement.qmd
format:
  pdf:
    documentclass: scrreprt
    papersize: letter
    fontsize: 12pt
    syntax-highlighting: none
    geometry: [margin=1in]
    mainfont: SourceSans3-Regular.otf
    mainfontoptions:
      - Path=fonts/
      - BoldFont=SourceSans3-Bold.otf
      - ItalicFont=SourceSans3-RegularIt.otf
      - BoldItalicFont=SourceSans3-BoldIt.otf
    sansfont: SourceSans3-Regular.otf
    sansfontoptions:
      - Path=fonts/
      - BoldFont=SourceSans3-Bold.otf
      - ItalicFont=SourceSans3-RegularIt.otf
      - BoldItalicFont=SourceSans3-BoldIt.otf
    monofont: lmmonolt10-regular.otf
    monofontoptions:
      - Path=fonts/
      - BoldFont=lmmonolt10-bold.otf
      - ItalicFont=lmmonolt10-oblique.otf
      - BoldItalicFont=lmmonolt10-boldoblique.otf
    mathfont: latinmodern-math.otf
    mathfontoptions:
      - Path=fonts/
    colorlinks: true
    linkcolor: black
    urlcolor: black
    citecolor: black
    toc: true
    toc-depth: 2
    number-sections: false
    keep-tex: true
    pdf-engine: xelatex
    latex-auto-install: false
    output-file: econometrics-handbook-working.pdf
    include-in-header:
      text: |
        \usepackage{microtype}
        \newfontfamily\levelsymbols[Path=fonts/]{DejaVuSans.ttf}
        \newcommand{\levelglyph}[1]{{\levelsymbols#1}}
        \pagestyle{plain}
        \setlength{\emergencystretch}{3em}
        \raggedbottom
execute:
  enabled: false
